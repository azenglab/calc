<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azenglab.com</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #666666;
            --border-color: #eaeaea;
            --hover-border: #111111;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1117;
                --card-bg: #161b22;
                --text-main: #e6edf3;
                --text-sub: #8b949e;
                --border-color: #30363d;
                --hover-border: #8b949e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        header {
            margin-bottom: 32px;
            padding-left: 4px;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-sub);
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .link-item:hover {
            border-color: var(--hover-border);
            transform: translateY(-1px);
        }

        .link-title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .link-desc {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .link-action {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-family: monospace;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>azenglab.com</h1>
            <p>个人学习与日常工具索引</p>
        </header>

        <div class="link-list">
            <a href="calculator.html" class="link-item">
                <div>
                    <div class="link-title">简易计算器</div>
                    <div class="link-desc">轻量日常四则运算</div>
                </div>
                <div class="link-action">calculator.html</div>
            </a>

            <a href="tongyinzi.html" class="link-item">
                <div>
                    <div class="link-title">同音字查询</div>
                    <div class="link-desc">汉字快速同音检索</div>
                </div>
                <div class="link-action">tongyinzi.html</div>
            </a>

            <a href="yinianjizuotishizibiao.html" class="link-item">
                <div>
                    <div class="link-title">一年级做题识字表</div>
                    <div class="link-desc">低年级识字练习，支持打印 PDF</div>
                </div>
                <div class="link-action">yinianjizuotishizibiao.html</div>
            </a>

            <a href="lunbanics.html" class="link-item">
                <div>
                    <div class="link-title">轮班日历导出</div>
                    <div class="link-desc">生成 .ics 文件导入手机日历</div>
                </div>
                <div class="link-action">lunbanics.html</div>
            </a>
        </div>

        <footer>
            azenglab &copy; 2026
        </footer>
    </div>

</body>
</html>
